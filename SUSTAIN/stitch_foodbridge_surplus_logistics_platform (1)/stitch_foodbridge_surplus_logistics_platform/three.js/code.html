<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_25 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_25" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_25');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_21');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // --- Constants & Config ---
  const GLOBE_RADIUS = 2;
  const BORDER_RADIUS = 2.005; // Slightly above surface to prevent z-fighting
  const MARKER_RADIUS = 2.04;
  const BRAND_GREEN = '#4ADE80';
  
  // --- Shaders ---
  const EarthShader = {
    uniforms: {
      uDayTex: { value: null },
      uNightTex: { value: null },
      uSunDirection: { value: new THREE.Vector3(5, 3, 5).normalize() }
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uDayTex;
      uniform sampler2D uNightTex;
      uniform vec3 uSunDirection;
      varying vec2 vUv;
      varying vec3 vNormal;
      void main() {
        vec3 dayColor = texture2D(uDayTex, vUv).rgb;
        vec3 nightColor = texture2D(uNightTex, vUv).rgb;
        float dotNL = dot(vNormal, uSunDirection);
        float dayWeight = smoothstep(-0.2, 0.2, dotNL);
        vec3 color = mix(nightColor, dayColor, dayWeight);
        gl_FragColor = vec4(color, 1.0);
      }
    `
  };

  const AtmosphereShader = {
    uniforms: {
      glowColor: { value: new THREE.Color(BRAND_GREEN) },
      coefficient: { value: 0.1 },
      power: { value: 4.0 }
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewDir = normalize(-mvPosition.xyz);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform vec3 glowColor;
      uniform float coefficient;
      uniform float power;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        float intensity = pow(coefficient + dot(vNormal, vViewDir), power);
        gl_FragColor = vec4(glowColor, intensity);
      }
    `
  };

  // --- Utils ---
  const latLongToVector3 = (lat, lng, radius) => {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lng + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  };

  // --- Scene Construction ---
  const textureLoader = new THREE.TextureLoader();
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);

  // 1. Earth
  const earthGeom = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
  const earthMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(EarthShader.uniforms),
    vertexShader: EarthShader.vertexShader,
    fragmentShader: EarthShader.fragmentShader
  });
  const earth = new THREE.Mesh(earthGeom, earthMat);
  globeGroup.add(earth);

  // Load textures (Assuming correct 2:1 projection)
  textureLoader.load('/textures/earth-day.jpg', (tex) => earthMat.uniforms.uDayTex.value = tex);
  textureLoader.load('/textures/earth-night.jpg', (tex) => earthMat.uniforms.uNightTex.value = tex);

  // 2. Cloud Layer
  const cloudGeom = new THREE.SphereGeometry(GLOBE_RADIUS + 0.02, 64, 64);
  const cloudMat = new THREE.MeshStandardMaterial({
    transparent: true,
    opacity: 0.4,
    depthWrite: false,
    blending: THREE.NormalBlending
  });
  const clouds = new THREE.Mesh(cloudGeom, cloudMat);
  textureLoader.load('/textures/earth-clouds.png', (tex) => cloudMat.map = tex);
  globeGroup.add(clouds);

  // 3. Atmosphere
  const atmosGeom = new THREE.SphereGeometry(GLOBE_RADIUS + 0.1, 64, 64);
  const atmosMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(AtmosphereShader.uniforms),
    vertexShader: AtmosphereShader.vertexShader,
    fragmentShader: AtmosphereShader.fragmentShader,
    side: THREE.BackSide,
    transparent: true,
    blending: THREE.AdditiveBlending
  });
  const atmosphere = new THREE.Mesh(atmosGeom, atmosMat);
  scene.add(atmosphere);

  // 4. Borders (GeoJSON Logic)
  const borderGroup = new THREE.Group();
  globeGroup.add(borderGroup);

  const loadBorders = async () => {
    try {
      // Note: In real app, source from public/data/world.json (Natural Earth 1:110m)
      const response = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson');
      const data = await response.json();
      
      data.features.forEach(feature => {
        const isIndia = feature.properties.NAME === 'India' || feature.properties.ISO_A3 === 'IND';
        const color = isIndia ? BRAND_GREEN : '#ffffff';
        const opacity = isIndia ? 0.8 : 0.2;
        const linewidth = isIndia ? 2 : 1;

        if (feature.geometry.type === 'Polygon') {
          renderPolygon(feature.geometry.coordinates[0], color, opacity, linewidth);
        } else if (feature.geometry.type === 'MultiPolygon') {
          feature.geometry.coordinates.forEach(poly => {
            renderPolygon(poly[0], color, opacity, linewidth);
          });
        }
      });
    } catch (e) {
      console.warn("GeoJSON load failed, using fallback display", e);
    }
  };

  const renderPolygon = (points, color, opacity, linewidth) => {
    const vertices = [];
    points.forEach(p => {
      const v = latLongToVector3(p[1], p[0], BORDER_RADIUS);
      vertices.push(v.x, v.y, v.z);
    });
    
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity, linewidth });
    const line = new THREE.Line(geometry, material);
    borderGroup.add(line);
  };

  loadBorders();

  // 5. Markers (Sustain Hubs)
  const markers = [
    { name: "Mumbai", lat: 19.0760, lng: 72.8777 },
    { name: "Delhi", lat: 28.7041, lng: 77.1025 },
    { name: "Bengaluru", lat: 12.9716, lng: 77.5946 },
    { name: "Chennai", lat: 13.0827, lng: 80.2707 },
    { name: "Kolkata", lat: 22.5726, lng: 88.3639 }
  ];

  const markerGeom = new THREE.SphereGeometry(0.02, 16, 16);
  const markerMat = new THREE.MeshBasicMaterial({ color: BRAND_GREEN });

  markers.forEach(m => {
    const pos = latLongToVector3(m.lat, m.lng, MARKER_RADIUS);
    const mesh = new THREE.Mesh(markerGeom, markerMat);
    mesh.position.copy(pos);
    mesh.userData = { name: m.name, lat: m.lat, lng: m.lng };
    globeGroup.add(mesh);
    
    // Pulse effect
    const pulseGeom = new THREE.SphereGeometry(0.03, 16, 16);
    const pulseMat = new THREE.MeshBasicMaterial({ color: BRAND_GREEN, transparent: true, opacity: 0.3 });
    const pulse = new THREE.Mesh(pulseGeom, pulseMat);
    pulse.position.copy(pos);
    globeGroup.add(pulse);
    
    mesh.pulse = pulse;
  });

  // --- Interaction & Fly-To ---
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let targetCameraPos = null;
  let isMoving = false;

  const flyTo = (lat, lng) => {
    targetCameraPos = latLongToVector3(lat, lng, 6);
    isMoving = true;
    startTime = Date.now();
  };

  window.addEventListener('click', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(globeGroup.children);
    if (intersects.length > 0 && intersects[0].object.userData.name) {
      const data = intersects[0].object.userData;
      flyTo(data.lat, data.lng);
    }
  });

  // --- Animation Loop ---
  camera.position.z = 10;
  let startTime = Date.now();
  const duration = 2500;
  
  // Initial fly-to India
  flyTo(22, 79);

  const animate = () => {
    requestAnimationFrame(animate);
    const now = Date.now();
    
    if (isMoving && targetCameraPos) {
      camera.position.lerp(targetCameraPos, 0.05);
      camera.lookAt(0,0,0);
      if (camera.position.distanceTo(targetCameraPos) < 0.1) isMoving = false;
    } else {
      globeGroup.rotation.y += 0.001;
      clouds.rotation.y += 0.0005;
    }

    // Pulse animation
    globeGroup.children.forEach(c => {
      if (c.pulse) {
        const s = 1 + Math.sin(now * 0.005) * 0.5;
        c.pulse.scale.set(s, s, s);
        c.pulse.material.opacity = 0.3 * (1 - (s-1));
      }
    });

    renderer.render(scene, camera);
  };

  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_25 -->
</body>
</html>
